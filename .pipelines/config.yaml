# In-repo CD pipeline for Olve.Pipelines (GitOps).
#
# This file is the single source of truth for how On Track To Grow is built, tested,
# and published. Bind a pipeline to this repo once and the service reconciles the live
# pipeline to match this file on every change; pushing a commit to master deploys
# automatically (the deploy poll is configured by the binding — no trigger declared here).
#
# Shape (example #4 from the Olve.Pipelines docs, adapted for .NET):
#   production (parallel)  : build-linux | build-windows   -> bundle
#   processing (sequential): test -> publish-itch -> publish-s3   (list order is the gate)
#
# Secrets are declared by NAME only; values live in the pipeline's k8s secret
# (olve-pipeline-{id}) and never in the repo. Every declared secret is mounted into
# every job as an ordinary env var. The S3__* names match the .NET config keys the
# asset pipeline reads (S3__Key -> S3:Key), so they inject with no extra mapping.
apiVersion: "0.0"
name: Olve.Trains
description: Build (Linux + Windows), screenshot-test, then publish On Track To Grow to itch.io and S3.
version: "1"

secrets:
  - name: GITHUB_TOKEN
    description: GitHub read token; fetches the repo tarball/clone into each job.
  # AWS credentials for the release/dist bucket only (publish-s3 + the test step's diff
  # upload). The asset pipeline no longer uses these — source art is committed via git LFS
  # and pulled during clone. (Part B of the self-host storage epic replaces these with
  # MinIO credentials.)
  - name: S3__Key
    description: AWS access key for the release/dist bucket (publish-s3, test diff upload).
  - name: S3__Secret
    description: AWS secret key for the release/dist bucket.
  - name: ITCH_API_KEY
    description: butler API key (BUTLER_API_KEY) for pushing builds to itch.io.
  # The publish-s3 step creates and writes its own dist bucket with the AWS identity above.

# One production step builds BOTH platforms (and runs the asset pipeline once). This is
# intentional: two parallel production steps make the controller promote the bundle twice,
# and the duplicate first-processing-step jobs mutually supersede each other (deadlock).
productionSteps:
  - name: build
    configuration:
      image: mcr.microsoft.com/dotnet/sdk:10.0
      scriptFile: scripts/build.sh
      environmentVariables:
        REPO: OliverVea/Olve.Trains
        BRANCH: master

# Processing steps run SEQUENTIALLY (list order). A failing step stops the chain, so the
# screenshot test gates both publishes.
# Order is the gate chain: archive to our own S3 first (fully automated, no external
# dependency), then the storefronts. Steam (steamcmd) appends after publish-itch once
# implemented. A failed step stops everything after it.
processingSteps:
  - name: test
    configuration:
      image: mcr.microsoft.com/dotnet/sdk:10.0
      scriptFile: scripts/test.sh
      environmentVariables:
        REPO: OliverVea/Olve.Trains
        BRANCH: master
        # On failure the step uploads diff/actual/baseline PNGs here (interim, in
        # lieu of the VR app) and logs presigned URLs to inspect them.
        S3_DIST_BUCKET: olve-trains-dist
        S3_DIST_REGION: ap-southeast-2
  - name: publish-s3
    configuration:
      image: debian:stable-slim
      scriptFile: scripts/publish-s3.sh
      environmentVariables:
        # Bucket is created by the step (idempotent) using the asset AWS identity,
        # in the same region/account as the asset bucket.
        S3_DIST_BUCKET: olve-trains-dist
        S3_DIST_PREFIX: releases
        S3_DIST_REGION: ap-southeast-2
        # ACLs are disabled on new AWS buckets by default, so the default share
        # mechanism is a presigned URL (logged per build). Leave empty unless the
        # bucket is configured for public objects; then a one-time bucket policy
        # makes the stable URLs below truly public.
        S3_DIST_ACL: ""
        # Optional stable public base URL (e.g. https://dl.example.com); empty = log keys only.
        S3_DIST_PUBLIC_BASE: ""
  - name: publish-itch
    configuration:
      image: debian:stable-slim
      scriptFile: scripts/publish-itch.sh
      environmentVariables:
        # itch.io target (user/game); channels :linux and :windows are pushed by the script.
        ITCH_TARGET: cookiscuit/on-track-to-grow
