name: Build and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

env:
  DOTNET_VERSION: 10.0.x

jobs:
  # 1️⃣ Build the Asset Pipeline (Linux)
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libassimp-dev

      - name: Run asset pipeline
        env:
          S3__Bucket: ${{ secrets.S3_BUCKET }}
          S3__Key: ${{ secrets.S3_KEY }}
          S3__Secret: ${{ secrets.S3_SECRET }}
          Build__OutputDirectory: ${{ github.workspace }}/src/Olve.Trains/assets
          Build__BuildDirectory: ${{ github.workspace }}/src/Olve.Trains.AssetPipeline/temp
          Shader__ShadersDirectory: ${{ github.workspace }}/src/Olve.Trains/resources/shaders
          Layout__LayoutsDirectory: ${{ github.workspace }}/src/Olve.Trains/resources/layouts
        run: dotnet run --project src/Olve.Trains.AssetPipeline/Olve.Trains.AssetPipeline.csproj

      - name: Upload assets to artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: built-assets
          path: src/Olve.Trains/assets

  # 2️⃣ Build .NET for both Linux & Windows using a Matrix
  build-dotnet:
    needs: build-assets
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: built-assets
          path: src/Olve.Trains/assets

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          output=$(dotnet run tools/version.cs -- --ci --run-number ${{ github.run_number }} --rid ${{ matrix.rid }})
          echo "$output"
          echo "$output" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore src/Olve.Trains/Olve.Trains.csproj

      - name: Build
        run: dotnet build src/Olve.Trains/Olve.Trains.csproj --configuration Release --output build/${{ matrix.rid }} -p:Version=${{ steps.version.outputs.version }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          path: build/${{ matrix.rid }}

  # 3️⃣ Screenshot validation (Linux only)
  validate-screenshot:
    needs: build-dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: built-assets
          path: src/Olve.Trains/assets

      - name: Install Xvfb, GLFW, and Mesa software renderer
        run: sudo apt-get update && sudo apt-get install -y xvfb libglfw3 mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0

      - name: Build Release
        run: dotnet build src/Olve.Trains/Olve.Trains.csproj --configuration Release

      - name: Run screenshot validation
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: bash scripts/integration-test.sh --skip-build --windowing xvfb

      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: /tmp/screenshot-diffs/
          if-no-files-found: ignore

      - name: Upload diffs to S3 and write job summary
        if: failure()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET }}
          AWS_DEFAULT_REGION: ap-southeast-2
        run: |
          echo "## Screenshot Validation Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review the diff images below. If the changes are expected, run the **Accept Screenshots** workflow to update references." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          found=false
          for diff_file in /tmp/screenshot-diffs/*/*.png; do
            [ -f "$diff_file" ] || continue
            found=true
            name=$(basename "$diff_file" .png)
            s3_key="screenshots/ci-run-${{ github.run_number }}/${name}.png"
            aws s3 cp "$diff_file" "s3://olve.trains/${s3_key}" --quiet
            url=$(aws s3 presign "s3://olve.trains/${s3_key}" --expires-in 604800)
            echo "- [${name}](${url})" >> $GITHUB_STEP_SUMMARY
          done

          if [ "$found" = false ]; then
            echo "No diff images found in /tmp/screenshot-diffs/" >> $GITHUB_STEP_SUMMARY
          fi
