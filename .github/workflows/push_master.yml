name: Build and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

env:
  DOTNET_VERSION: 10.0.x

jobs:
  # 1️⃣ Build the Asset Pipeline (Linux)
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libassimp-dev

      - name: Run asset pipeline
        env:
          S3__Bucket: ${{ secrets.S3_BUCKET }}
          S3__Key: ${{ secrets.S3_KEY }}
          S3__Secret: ${{ secrets.S3_SECRET }}
          Build__OutputDirectory: ${{ github.workspace }}/src/Olve.Trains/assets
          Build__BuildDirectory: ${{ github.workspace }}/src/Olve.Trains.AssetPipeline/temp
          Shader__ShadersDirectory: ${{ github.workspace }}/src/Olve.Trains/resources/shaders
          Layout__LayoutsDirectory: ${{ github.workspace }}/src/Olve.Trains/resources/layouts
        run: dotnet run --project src/Olve.Trains.AssetPipeline/Olve.Trains.AssetPipeline.csproj

      - name: Upload assets to artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: built-assets
          path: src/Olve.Trains/assets

  # 2️⃣ Build .NET for both Linux & Windows using a Matrix
  build-dotnet:
    needs: build-assets
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: built-assets
          path: src/Olve.Trains/assets

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          output=$(dotnet run tools/version.cs -- --ci --run-number ${{ github.run_number }} --rid ${{ matrix.rid }})
          echo "$output"
          echo "$output" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore src/Olve.Trains/Olve.Trains.csproj

      - name: Build
        run: dotnet build src/Olve.Trains/Olve.Trains.csproj --configuration Release --output build/${{ matrix.rid }} -p:Version=${{ steps.version.outputs.version }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          path: build/${{ matrix.rid }}

  # 3️⃣ Screenshot validation (Linux only)
  validate-screenshot:
    needs: build-dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: built-assets
          path: src/Olve.Trains/assets

      - name: Install Xvfb, GLFW, and Mesa software renderer
        run: sudo apt-get update && sudo apt-get install -y xvfb libglfw3 mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0

      - name: Build Release
        run: dotnet build src/Olve.Trains/Olve.Trains.csproj --configuration Release

      - name: Run screenshot validation
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: bash scripts/integration-test.sh --skip-build --windowing xvfb

      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: /tmp/screenshot-diffs/
          if-no-files-found: ignore

      - name: Upload diffs to S3 and create review
        if: failure()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET }}
          AWS_DEFAULT_REGION: ap-southeast-2
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          AUTHENTIK_CLIENT_SECRET: ${{ secrets.AUTHENTIK_CLIENT_SECRET }}
        run: |
          S3_PREFIX="screenshots/ci-run-${{ github.run_number }}"
          SCREENSHOTS='[]'

          for diff_dir in /tmp/screenshot-diffs/*/; do
            [ -d "$diff_dir" ] || continue
            test_name=$(basename "$diff_dir")

            for diff_file in "$diff_dir"/*-diff.png; do
              [ -f "$diff_file" ] || continue
              name=$(basename "$diff_file" -diff.png)

              # Upload diff image as public-read
              s3_key="${S3_PREFIX}/${name}-diff.png"
              aws s3 cp "$diff_file" "s3://olve.trains/${s3_key}" --acl public-read --quiet
              diff_url="https://olve.trains.s3.ap-southeast-2.amazonaws.com/${s3_key}"

              # Upload actual screenshot if it exists
              actual_url=""
              for actual in /tmp/integration-test-*/"${name}.png"; do
                if [ -f "$actual" ]; then
                  actual_key="${S3_PREFIX}/${name}-actual.png"
                  aws s3 cp "$actual" "s3://olve.trains/${actual_key}" --acl public-read --quiet
                  actual_url="https://olve.trains.s3.ap-southeast-2.amazonaws.com/${actual_key}"
                  break
                fi
              done

              # Upload baseline if it exists
              baseline_url=""
              baseline="tests/integration/reference/linux/${name}.png"
              if [ -f "$baseline" ]; then
                baseline_key="${S3_PREFIX}/${name}-baseline.png"
                aws s3 cp "$baseline" "s3://olve.trains/${baseline_key}" --acl public-read --quiet
                baseline_url="https://olve.trains.s3.ap-southeast-2.amazonaws.com/${baseline_key}"
              fi

              SCREENSHOTS=$(echo "$SCREENSHOTS" | python3 -c "
          import sys, json
          s = json.load(sys.stdin)
          s.append({
              'name': '${name}',
              'baselineUrl': '${baseline_url}',
              'actualUrl': '${actual_url}',
              'diffUrl': '${diff_url}',
              'similarity': 0.0
          })
          json.dump(s, sys.stdout)")
            done
          done

          # Create review in VR app
          if [ -n "$AUTHENTIK_CLIENT_ID" ] && [ -n "$AUTHENTIK_CLIENT_SECRET" ]; then
            TOKEN=$(curl -sf -X POST "https://authentik.ovhome.online/application/o/token/" \
              -d "grant_type=client_credentials" \
              -d "client_id=${AUTHENTIK_CLIENT_ID}" \
              -d "client_secret=${AUTHENTIK_CLIENT_SECRET}" \
              -d "scope=openid" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

            REVIEW_BODY=$(python3 -c "
          import json, sys
          print(json.dumps({
              'project': 'Olve.Trains',
              'branch': 'master',
              'commitSha': '${{ github.sha }}',
              'runNumber': ${{ github.run_number }},
              'screenshots': json.loads(sys.stdin.read())
          }))" <<< "$SCREENSHOTS")

            REVIEW_URL=$(curl -sf -X POST "https://vr.ovhome.online/api/reviews" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$REVIEW_BODY" | python3 -c "import sys,json; r=json.load(sys.stdin); print(f'https://vr.ovhome.online/review/{r[\"id\"]}')")

            echo "## Screenshot Validation Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review and approve the changes: [Open Review](${REVIEW_URL})" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Screenshot Validation Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "AUTHENTIK_CLIENT_ID/SECRET not configured — cannot create review." >> $GITHUB_STEP_SUMMARY
          fi
