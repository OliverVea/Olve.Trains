name: Build and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

env:
  DOTNET_VERSION: 10.0.x

jobs:
  # 1️⃣ Build the Asset Pipeline (Linux)
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libassimp-dev

      - name: Run asset pipeline
        env:
          S3__Bucket: ${{ secrets.S3_BUCKET }}
          S3__Key: ${{ secrets.S3_KEY }}
          S3__Secret: ${{ secrets.S3_SECRET }}
          Build__OutputDirectory: ${{ github.workspace }}/src/Olve.Trains/assets
          Build__BuildDirectory: ${{ github.workspace }}/src/Olve.Trains.AssetPipeline/temp
          Shader__ShadersDirectory: ${{ github.workspace }}/src/Olve.Trains/resources/shaders
          Layout__LayoutsDirectory: ${{ github.workspace }}/src/Olve.Trains/resources/layouts
        run: dotnet run --project src/Olve.Trains.AssetPipeline/Olve.Trains.AssetPipeline.csproj

      - name: Upload assets to artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: built-assets
          path: src/Olve.Trains/assets

  # 2️⃣ Build .NET for both Linux & Windows using a Matrix
  build-dotnet:
    needs: build-assets
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: built-assets
          path: src/Olve.Trains/assets

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          output=$(dotnet run tools/version.cs -- --ci --run-number ${{ github.run_number }} --rid ${{ matrix.rid }})
          echo "$output"
          echo "$output" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore src/Olve.Trains/Olve.Trains.csproj

      - name: Build
        run: dotnet build src/Olve.Trains/Olve.Trains.csproj --configuration Release --output build/${{ matrix.rid }} -p:Version=${{ steps.version.outputs.version }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          path: build/${{ matrix.rid }}

  # 3️⃣ Screenshot validation (Linux & Windows)
  validate-screenshot:
    needs: build-dotnet
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            windowing: xvfb
          - os: windows-latest
            platform: windows
            windowing: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: built-assets
          path: src/Olve.Trains/assets

      - name: Install Xvfb, GLFW, and Mesa software renderer (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libglfw3 mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0

      - name: Download Mesa software renderer (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          MESA_VERSION="24.3.2"
          curl -sL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          7z x mesa.7z -omesa

      - name: Build Release
        run: dotnet build src/Olve.Trains/Olve.Trains.csproj --configuration Release

      - name: Install Mesa software renderer (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cp mesa/x64/opengl32.dll mesa/x64/libgallium_wgl.dll mesa/x64/libglapi.dll "src/Olve.Trains/bin/Release/net10.0/"
          cp mesa/x64/opengl32.dll mesa/x64/libgallium_wgl.dll mesa/x64/libglapi.dll "src/Olve.Trains/bin/Release/net10.0/runtimes/win-x64/native/"

      - name: Run screenshot validation
        env:
          LIBGL_ALWAYS_SOFTWARE: ${{ matrix.platform == 'linux' && '1' || '' }}
          GALLIUM_DRIVER: ${{ matrix.platform == 'windows' && 'llvmpipe' || '' }}
          SCREENSHOT_DIFF_DIR: ${{ runner.temp }}/screenshot-diffs
        shell: bash
        run: bash scripts/integration-test.sh --skip-build --windowing ${{ matrix.windowing }}

      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs-${{ matrix.platform }}
          path: ${{ runner.temp }}/screenshot-diffs/
          if-no-files-found: ignore

      - name: Upload images and create review
        if: failure()
        shell: bash
        env:
          AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID }}
          AUTHENTIK_CLIENT_SECRET: ${{ secrets.AUTHENTIK_CLIENT_SECRET }}
        run: |
          VR_BASE="https://vr.ovhome.online"
          PLATFORM="${{ matrix.platform }}"
          DIFF_BASE="${RUNNER_TEMP}/screenshot-diffs"

          # Get Authentik token
          if [ -z "$AUTHENTIK_CLIENT_ID" ] || [ -z "$AUTHENTIK_CLIENT_SECRET" ]; then
            echo "## Screenshot Validation Failed ($PLATFORM)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "AUTHENTIK_CLIENT_ID/SECRET not configured — cannot create review." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          TOKEN=$(curl -sf -X POST "https://authentik.ovhome.online/application/o/token/" \
            -d "grant_type=client_credentials" \
            -d "client_id=${AUTHENTIK_CLIENT_ID}" \
            -d "client_secret=${AUTHENTIK_CLIENT_SECRET}" \
            -d "scope=openid" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          upload_image() {
            local file="$1"
            if [ ! -f "$file" ]; then echo ""; return; fi
            local url=$(curl -sf -X POST "${VR_BASE}/api/images" \
              -H "Authorization: Bearer $TOKEN" \
              -F "file=@${file}" | python3 -c "import sys,json; print(json.load(sys.stdin)['url'])")
            echo "${VR_BASE}${url}"
          }

          # Parse similarity values from pytest output if available
          SIMILARITY_FILE="/tmp/pytest-similarities.json"
          echo '{}' > "$SIMILARITY_FILE"

          SCREENSHOTS='[]'

          for diff_dir in "${DIFF_BASE}"/*/; do
            [ -d "$diff_dir" ] || continue

            for diff_file in "$diff_dir"/*-diff.png; do
              [ -f "$diff_file" ] || continue
              name=$(basename "$diff_file" -diff.png)

              # Upload images to VR app
              diff_url=$(upload_image "$diff_file")

              actual_url=""
              actual_path_file="${diff_dir}${name}-actual.txt"
              if [ -f "$actual_path_file" ]; then
                actual_file=$(cat "$actual_path_file")
                actual_url=$(upload_image "$actual_file")
              fi

              baseline_url=""
              baseline="tests/integration/reference/${PLATFORM}/${name}.png"
              if [ -f "$baseline" ]; then
                baseline_url=$(upload_image "$baseline")
              fi

              similarity=0.0
              similarity_file="${diff_dir}${name}-similarity.txt"
              if [ -f "$similarity_file" ]; then
                similarity=$(cat "$similarity_file")
              fi

              SCREENSHOTS=$(echo "$SCREENSHOTS" | python3 -c "
          import sys, json
          s = json.load(sys.stdin)
          s.append({
              'name': '${name}',
              'baselineUrl': '${baseline_url}',
              'actualUrl': '${actual_url}',
              'diffUrl': '${diff_url}',
              'similarity': ${similarity}
          })
          json.dump(s, sys.stdout)")
            done
          done

          REVIEW_BODY=$(python3 -c "
          import json, sys
          print(json.dumps({
              'project': 'Olve.Trains',
              'branch': 'master',
              'commitSha': '${{ github.sha }}',
              'runNumber': ${{ github.run_number }},
              'platform': '${PLATFORM}',
              'screenshots': json.loads(sys.stdin.read())
          }))" <<< "$SCREENSHOTS")

          REVIEW_URL=$(curl -sf -X POST "${VR_BASE}/api/reviews" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$REVIEW_BODY" | python3 -c "import sys,json; r=json.load(sys.stdin); print(f'https://vr.ovhome.online/review/{r[\"id\"]}')")

          echo "## Screenshot Validation Failed ($PLATFORM)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review and approve the changes: [Open Review](${REVIEW_URL})" >> $GITHUB_STEP_SUMMARY
