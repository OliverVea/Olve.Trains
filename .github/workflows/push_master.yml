name: Push to master

on:
  push:
    branches:
      - master

permissions:
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

env:
  DOTNET_VERSION: 9.0.100
  S3_URL: http://100.124.27.29:9000
  S3_BUCKET: olve.trains
  TS_EXIT_NODE: tailscale-home

jobs:
  build:
    name: Build game and save in minio
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
        
      - name: Tailscale Up
        run: sudo tailscale up

      - name: Setup .env
        run: |
          echo "S3_URL=${{ env.S3_URL }}" >> ./src/Olve.Trains.AssetPipeline/.env
          echo "S3_BUCKET=${{ env.S3_BUCKET }}" >> ./src/Olve.Trains.AssetPipeline/.env
          echo "S3_KEY=${{ secrets.MINIO_ACCESS_KEY }}" >> ./src/Olve.Trains.AssetPipeline/.env
          echo "S3_SECRET=${{ secrets.MINIO_SECRET_KEY }}" >> ./src/Olve.Trains.AssetPipeline/.env
          echo "LOG_LEVEL=Debug" >> ./src/Olve.Trains.AssetPipeline/.env

      - name: Ping Minio
        run: ping -c 5 ${{ env.S3_URL }}


      - name: Run asset pipeline
        shell: bash
        run: sh ./src/Olve.Trains.AssetPipeline/build.sh

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: .NET restore
        shell: bash
        run: dotnet restore

      - name: Build
        shell: bash
        run: dotnet build --no-restore -c Release /p:Version="1.0.0"

      - name: Publish
        shell: bash
        run: dotnet publish --no-restore -c Release /p:Version="1.0.0" --output ./publish

      - name: Minio Deploy
        uses: lovellfelix/minio-deploy-action@v1
        with:
          endpoint: ${{ secrets.MINIO_ENDPOINT }}
          access_key: ${{ secrets.MINIO_ACCESS_KEY }}
          secret_key: ${{ secrets.MINIO_SECRET_KEY }}
          bucket: 'olve-trains'
          source_dir: './publish'
          target_dir: 'releases/1.0.0'
