name: Build and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  actions: read
  pages: write
  id-token: write

jobs:
  # 1️⃣ Build the Asset Pipeline (Linux)
  build-assets:
    name: Build game and save in minio
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup .env
        run: |
          echo "S3_URL=${{ env.MINIO_URL }}" >> ./src/Olve.Trains.AssetPipeline/.env
          echo "S3_BUCKET=${{ env.MINIO_BUCKET }}" >> ./src/Olve.Trains.AssetPipeline/.env
          echo "S3_KEY=${{ secrets.MINIO_ACCESS_KEY }}" >> ./src/Olve.Trains.AssetPipeline/.env
          echo "S3_SECRET=${{ secrets.MINIO_SECRET_KEY }}" >> ./src/Olve.Trains.AssetPipeline/.env
          echo "CF_CLIENT_ID=${{ secrets.CF_CLIENT_ID }}" >> ./src/Olve.Trains.AssetPipeline/.env
          echo "CF_CLIENT_SECRET=${{ secrets.CF_CLIENT_SECRET }}" >> ./src/Olve.Trains.AssetPipeline/.env
          echo "LOG_LEVEL=Debug" >> ./src/Olve.Trains.AssetPipeline/.env

      - name: Run asset pipeline
        shell: bash
        run: sh ./src/Olve.Trains.AssetPipeline/build.sh

  # 2️⃣ Build .NET for both Linux & Windows using a Matrix
  build-dotnet:
    needs: build-assets
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest] # Run on both OSes
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: built-assets
          path: src/Olve.Trains/assets

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore src/Olve.Trains/Olve.Trains.csproj

      - name: Build
        run: dotnet build src/Olve.Trains/Olve.Trains.csproj --configuration Release --output build/${{ runner.os }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: build/${{ runner.os }}
