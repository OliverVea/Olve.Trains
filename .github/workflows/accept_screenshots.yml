name: Accept Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: 10.0.x

jobs:
  accept-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libassimp-dev xvfb libglfw3 mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0

      - name: Run asset pipeline
        env:
          S3__Bucket: ${{ secrets.S3_BUCKET }}
          S3__Key: ${{ secrets.S3_KEY }}
          S3__Secret: ${{ secrets.S3_SECRET }}
          Build__OutputDirectory: ${{ github.workspace }}/src/Olve.Trains/assets
          Build__BuildDirectory: ${{ github.workspace }}/src/Olve.Trains.AssetPipeline/temp
          Shader__ShadersDirectory: ${{ github.workspace }}/src/Olve.Trains/resources/shaders
          Layout__LayoutsDirectory: ${{ github.workspace }}/src/Olve.Trains/resources/layouts
        run: dotnet run --project src/Olve.Trains.AssetPipeline/Olve.Trains.AssetPipeline.csproj

      - name: Build Release
        run: dotnet build src/Olve.Trains/Olve.Trains.csproj --configuration Release

      - name: Update reference screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: bash scripts/integration-test.sh --skip-build --windowing xvfb --update-references

      - name: Verify updated references pass
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: bash scripts/integration-test.sh --skip-build --windowing xvfb

      - name: Commit and push updated references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/reference/linux/
          if git diff --cached --quiet; then
            echo "No reference changes to commit"
            exit 0
          fi
          git commit -m "ci: update Linux reference screenshots [skip ci]"
          git push
