<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Olve.Trains — Interactive Architecture</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#121821; --panel:#161d28; --panel2:#1b2330;
    --line:#283142; --line2:#323d52;
    --ink:#e6edf3; --ink-dim:#9aa7b8; --ink-faint:#647082;
    --accent:#58a6ff; --accent2:#d8e0ea;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
    -webkit-font-smoothing:antialiased}
  #app{display:flex;height:100vh;width:100vw}

  /* ---- left sidebar ---- */
  #side{width:312px;min-width:312px;height:100%;background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5;
    transition:margin-left .24s cubic-bezier(.4,0,.2,1)}
  #side.collapsed{margin-left:-312px}
  /* floating bar toggles (always visible) */
  .bar-toggle{position:absolute;z-index:8;width:38px;height:38px;border-radius:9px;
    background:rgba(22,29,40,.92);border:1px solid var(--line2);color:var(--ink);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.4);font-size:17px;line-height:1}
  .bar-toggle:hover{border-color:var(--accent)}
  #side-toggle{top:12px;left:12px}
  #side:not(.collapsed) ~ #stage #side-toggle{left:12px}
  .brand{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .brand h1{font-size:15px;margin:0;letter-spacing:.2px}
  .brand .sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:3px}
  .brand p{font-size:11.5px;line-height:1.5;color:var(--ink-dim);margin:9px 0 0}
  .side-scroll{overflow-y:auto;flex:1;padding:12px 14px 22px}
  .side-scroll::-webkit-scrollbar{width:8px}
  .side-scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
  .sect{margin-top:16px}
  .sect-h{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
  .sect-h .act{cursor:pointer;color:var(--ink-faint);font-size:10px}
  .sect-h .act:hover{color:var(--accent)}

  #search{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--ink);
    border-radius:8px;padding:9px 11px;font-size:12.5px;font-family:var(--sans);outline:none}
  #search:focus{border-color:var(--accent)}
  #search::placeholder{color:var(--ink-faint)}
  .search-meta{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:6px;min-height:12px}

  .leg-row{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:7px;cursor:pointer;
    user-select:none;font-size:12px;transition:background .12s}
  .leg-row:hover{background:var(--panel)}
  .leg-row.off{opacity:.38}
  .sw{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
  .leg-row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .leg-row .ct{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .leg-row .solo{font-family:var(--mono);font-size:9px;color:var(--ink-faint);opacity:0;
    border:1px solid var(--line2);border-radius:4px;padding:1px 4px}
  .leg-row:hover .solo{opacity:1}
  .leg-row .solo:hover{color:var(--accent);border-color:var(--accent)}
  .layer-label{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);
    letter-spacing:.5px;margin:10px 0 3px 7px;text-transform:uppercase}

  .edge-leg{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-dim);padding:3px 7px}
  .edge-leg svg{flex:none}
  .btn{background:var(--panel);border:1px solid var(--line2);color:var(--ink-dim);border-radius:7px;
    padding:7px 10px;font-size:11.5px;cursor:pointer;font-family:var(--sans);flex:1;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--ink)}
  .btn-row{display:flex;gap:7px;margin-top:10px}

  /* ---- canvas ---- */
  #stage{flex:1;position:relative;overflow:hidden}
  #canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
  #canvas.grabbing{cursor:grabbing}
  #canvas.pointing{cursor:pointer}
  #tooltip{position:absolute;pointer-events:none;background:rgba(20,26,36,.97);border:1px solid var(--line2);
    border-radius:8px;padding:8px 10px;max-width:280px;font-size:11.5px;color:var(--ink);
    box-shadow:0 8px 28px rgba(0,0,0,.5);opacity:0;transition:opacity .1s;z-index:9}
  #tooltip .tt-t{font-weight:600;font-size:12px}
  #tooltip .tt-s{color:var(--ink-dim);margin-top:3px;line-height:1.45}
  #tooltip .tt-m{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);margin-top:5px;letter-spacing:.4px}
  .hint{position:absolute;left:16px;bottom:14px;font-family:var(--mono);font-size:10px;color:var(--ink-faint);
    background:rgba(13,17,23,.6);padding:5px 9px;border-radius:6px;border:1px solid var(--line);pointer-events:none}
  #zoomctl{position:absolute;right:16px;bottom:14px;display:flex;gap:6px}
  #zoomctl button{width:30px;height:30px;border-radius:7px;background:rgba(22,29,40,.9);border:1px solid var(--line2);
    color:var(--ink-dim);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #zoomctl button:hover{border-color:var(--accent);color:var(--ink)}

  /* ---- detail panel ---- */
  #detail{position:absolute;top:0;right:0;height:100%;width:340px;background:linear-gradient(180deg,var(--panel),var(--bg2));
    border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
    z-index:6;display:flex;flex-direction:column}
  #detail.open{transform:translateX(0)}
  .d-head{padding:16px 18px 13px;border-bottom:1px solid var(--line);position:relative}
  .d-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.8px;display:flex;align-items:center;gap:7px}
  .d-kicker .sw{width:9px;height:9px}
  .d-head h2{margin:8px 0 0;font-size:17px;line-height:1.25;word-break:break-word}
  .d-type{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:5px}
  .d-close{position:absolute;top:13px;right:14px;cursor:pointer;color:var(--ink-faint);font-size:18px;
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px}
  .d-close:hover{background:var(--panel2);color:var(--ink)}
  .d-body{overflow-y:auto;padding:15px 18px 30px;flex:1}
  .d-body::-webkit-scrollbar{width:8px}
  .d-body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
  .d-summary{font-size:13px;line-height:1.55;color:var(--ink)}
  .d-sec{margin-top:18px}
  .d-sec h3{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 8px}
  .file{font-family:var(--mono);font-size:11px;color:var(--accent2);background:var(--bg);border:1px solid var(--line);
    border-radius:6px;padding:6px 8px;margin-bottom:5px;word-break:break-all;line-height:1.4}
  .tag{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--ink-dim);background:var(--panel2);
    border:1px solid var(--line2);border-radius:20px;padding:2px 9px;margin:0 5px 5px 0}
  .rel{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12px;
    transition:background .12s}
  .rel:hover{background:var(--panel2)}
  .rel .dir{font-family:var(--mono);font-size:9px;width:26px;flex:none;text-align:center;border-radius:4px;padding:2px 0}
  .rel .dir.out{background:rgba(88,166,255,.14);color:#79b8ff}
  .rel .dir.in{background:rgba(224,123,84,.14);color:#e89a7c}
  .rel .rl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rel .rtype{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint)}
  .rel .rsw{width:8px;height:8px;border-radius:2px;flex:none}
  .empty{color:var(--ink-faint);font-size:11.5px;font-style:italic}
  .ov-ctl{display:flex;flex-wrap:wrap;gap:5px}
  .ov-btn{flex:1 1 44%;background:var(--panel);border:1px solid var(--line2);color:var(--ink-dim);
    border-radius:7px;padding:6px 6px;font-size:11px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .ov-btn:hover{border-color:var(--accent);color:var(--ink)}
  .ov-btn.on{background:var(--accent);border-color:var(--accent);color:#06223f;font-weight:600}
  #overlay-legend{margin-top:9px}
  #overlay-legend .ov-bar{height:9px;border-radius:5px;margin:6px 0 3px}
  #overlay-legend .ov-scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint)}
  #overlay-legend .ov-note{font-size:10.5px;color:var(--ink-dim);margin-top:5px;line-height:1.4}
  .d-metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:6px}
  .d-metrics .mrow{display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .d-metrics .mrow .mk{color:var(--ink-dim)}
  .d-metrics .mrow .mv{font-family:var(--mono);font-weight:600}
  .mi-badge{display:inline-block;padding:1px 7px;border-radius:20px;font-family:var(--mono);font-size:10px;font-weight:700}

  /* ---- mobile / narrow screens ---- */
  @media (max-width:760px){
    /* sidebar becomes a full-height overlay, collapsed by default */
    #side{position:absolute;top:0;left:0;width:86vw;max-width:330px;min-width:0;
      margin-left:0;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.6)}
    #side:not(.collapsed){transform:translateX(0)}
    #side.collapsed{margin-left:0;transform:translateX(-100%)}
    /* detail panel takes the full screen */
    #detail{width:100vw;border-left:none}
    /* keep the side toggle clear of the panel; bump control sizes for touch */
    .bar-toggle{width:42px;height:42px;font-size:19px}
    #zoomctl button{width:38px;height:38px;font-size:18px}
    .hint{display:none}
    .d-head h2{font-size:19px}
    .d-body{padding-bottom:40px}
    /* dim backdrop when the sidebar overlay is open */
    #side:not(.collapsed)::after{content:"";position:fixed;inset:0;left:86vw;
      width:100vw;height:100vh;background:rgba(0,0,0,.45);z-index:-1}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <h1>Olve.Trains</h1>
      <div class="sub" id="brand-sub">architecture · loading…</div>
      <p id="brand-summary"></p>
    </div>
    <div class="side-scroll">

        <input id="search" placeholder="Search nodes, files, tags…" autocomplete="off" spellcheck="false"/>
        <div class="search-meta" id="search-meta"></div>
      </div>
      <div class="sect">
        <div class="sect-h">Abstraction tiers <span style="color:var(--ink-faint);text-transform:none;letter-spacing:0">↑ vertical axis</span></div>

      <div class="sect">
        <div class="sect-h">Subsystems <span class="act" id="show-all">show all</span></div>

      </div>
      <div class="sect">
        <div class="sect-h">Metrics overlay <span style="color:var(--ink-faint);text-transform:none;letter-spacing:0">Roslyn</span></div>
        <div id="overlay-ctl" class="ov-ctl">
          <button data-ov="off" class="ov-btn on">Off</button>

          <button data-ov="maint" class="ov-btn">Maintainability</button>

      </div>
      <div class="sect">

        <div class="edge-leg"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#d8e0ea" stroke-width="1.6" stroke-dasharray="4 3"/></svg><span>cross-subsystem flow</span></div>
        <div class="btn-row">
          <button class="btn" id="btn-reset">Reset view</button>
          <button class="btn" id="btn-relayout">Re-run layout</button>

      <div class="sect">

        <div class="search-meta" id="stats"></div>

  </aside>

  <div id="stage">
    <canvas id="canvas"></canvas>
    <button id="side-toggle" class="bar-toggle" title="Toggle panel" aria-label="Toggle panel">☰</button>
    <div id="tooltip"></div>
    <div class="hint">drag · scroll zoom · click node</div>
    <div id="zoomctl">
      <button id="zin">+</button><button id="zout">−</button><button id="zfit" title="fit">⊡</button>
    </div>
  </div>

  <aside id="detail">
    <div class="d-head">
      <div class="d-close" id="d-close">×</div>
      <div class="d-kicker"><span class="sw" id="d-sw"></span><span id="d-sub"></span></div>
      <h2 id="d-title"></h2>
      <div class="d-type" id="d-type"></div>
    </div>
    <div class="d-body">
      <div class="d-summary" id="d-summary"></div>
      <div class="d-sec" id="d-metrics-sec"><h3>Code metrics <span style="color:var(--ink-faint)">Roslyn</span></h3><div class="d-metrics" id="d-metrics"></div></div>
      <div class="d-sec" id="d-files-sec"><h3>Key files</h3><div id="d-files"></div></div>
      <div class="d-sec" id="d-tags-sec"><h3>Tags</h3><div id="d-tags"></div></div>
      <div class="d-sec"><h3>Connections <span id="d-rel-ct" style="color:var(--ink-faint)"></span></h3><div id="d-rels"></div></div>
    </div>
  </aside>
</div>

<script id="graph-data" type="application/json">{"meta":{"title":"Olve.Trains \u2014 Architecture","generated":"2026-06-21","summary":"On Track To Grow \u2014 a train-logistics city-builder on a bespoke C# OpenGL engine. Olve.Engine3D provides rendering, scenes, GUI and command infrastructure; Olve.Trains builds the simulation (tracks, trains, cargo, industries) and its presentation on top; an asset pipeline code-generates shader/layout types and Olve.Pipelines runs CD."},"layers":{"overview":{"label":"Overview","order":0},"engine":{"label":"Engine (Olve.Engine3D)","order":1},"game":{"label":"Game (Olve.Trains)","order":2},"tooling":{"label":"Tooling & CI","order":3}},"subsystems":{"tooling":{"id":"tooling","label":"Commands, Pipeline & CI","layer":"tooling","summary":"The tooling layer covers the in-game command interface (verb-based handlers that query and mutate game state and emit JSON), the asset pipeline that compiles shaders/layouts/meshes/textures/terrains/fonts/atlases into binary assets and generated C# via Scriban templates, and the GitOps CD pipeline (Olve.Pipelines) that builds Linux+Windows, screenshot-tests, and publishes to S3 and itch.io. Command handlers deliver the observability contract (list-/query- per entity), the pipeline feeds generated code into the game build, and CI gates every publish on the integration test suite.","color":"#b07bd6"},"engine-core":{"id":"engine-core","label":"Engine Core","layer":"engine","summary":"The foundational engine infrastructure in Olve.Engine3D: a scene system that orchestrates prioritized scene services through a load/activate/update/render lifecycle, an event system (Event<T>/EventQueue bridged into scene lifecycle), a detached-mode command system over named pipes, input schemes, time stepping (windowed and manual/deterministic), entity storage with indexes, spline interpolation, and collision/raycast physics. Almost all gameplay and rendering features are composed as scene services over these primitives.","color":"#5fb0c9"},"engine-gui":{"id":"engine-gui","label":"GUI System","layer":"engine","summary":"A retained-mode, tree-based GUI toolkit in Olve.Engine3D. Element trees (Box/Text/Image plus interactive widgets) are registered against screen or element-relative anchors, then a flexbox-style layout service computes density-independent positions consumed by collision/hit-testing, mouse input, focus/activation, state-driven styling, and time-based animation. Text is laid out from MSDF font atlases.","color":"#6bc6b8"},"engine-rendering":{"id":"engine-rendering","label":"Rendering Pipeline","layer":"engine","summary":"The unified GPU rendering pipeline of Olve.Engine3D. All 2D and 3D drawing flows through a single always-instanced RenderingManager backed by geometry, group, and instance managers, executed across ordered render passes into framebuffers. Supporting subsystems provide camera matrices, daylight/lighting curves, mesh/texture/shader asset management, and a thin typed OpenGL handle layer.","color":"#4f9dde"},"game-logic":{"id":"game-logic","label":"Game Logic","layer":"game","summary":"The simulation/domain layer of Olve.Trains, registered as scene services for SceneIds.GameLogicScene. It models the playable world: terrain and grid, placeable tracks and junctions with signal routing, trains and wagons that move along track splines, buildings that specialize into stations/depots/industries/residences, and the cargo economy where resources feed industries and cargo flows through stations onto trains. Domains communicate largely through events (OnBuildingAdded, OnTrackAdded, OnTrainReachedTrackEnd, etc.) wired in GameLogicSceneServiceRegistration.","color":"#e0a23a"},"game-presentation":{"id":"game-presentation","label":"Presentation & Shell","layer":"game","summary":"The presentation layer turns game-logic state into pixels and player interaction. Rendering services in the GameRendering scene subscribe to game-logic entity events (tracks, trains, wagons, buildings, environmental objects) and push instances into the engine's rendering managers, dual-registering shadow casters via the ShadowMapService. The GameUI scene layers in-world indicators, raycast-driven placement/deletion tools coordinated by a single-active-tool manager, and GUI panels; MainMenu, Loading, and a Shared GUI/rendering/telemetry foundation provide the surrounding app shell and bootstrap.","color":"#e07b54"},"overview":{"id":"overview","label":"Solution Overview","layer":"overview","summary":"Olve.Trains is the C# (.NET 10) codebase for 'On Track To Grow', a train-network building game. It is organized as a small custom OpenGL engine (Olve.Engine3D) providing rendering, GUI and core utilities, a game application (Olve.Trains) that builds game logic and presentation on top of the engine and exposes a command/replay interface, and an offline asset pipeline (Olve.Trains.AssetPipeline) that compiles shaders, layouts, meshes, textures and fonts into generated code. External dependencies cluster around Silk.NET (rendering/windowing/input/Assimp), MemoryPack (serialization), the Olve.* utility packages, Scriban (asset code-gen templating), and TUnit (testing).","color":"#9aa7b4"}},"nodes":[{"id":"tl-command-handler-base","label":"CommandHandlerService","type":"service","summary":"Abstract base for all command handlers: defines Verb, HelpString, Arguments, and Handle(CommandContext) returning Result<CommandOutput>.","keyFiles":["src/Olve.Trains/Commands/GameLogic/PlaceTrackHandlerService.cs","src/Olve.Trains/Commands/GameLogic/ListTracksHandlerService.cs"],"tags":["commands"],"subsystem":"tooling","layer":"tooling","degree":15,"tier":4},{"id":"tl-cmd-load-scene","label":"load-scene","type":"command","summary":"Loads a named scene; entry point for replay/test setup.","keyFiles":["src/Olve.Trains/Commands/LoadSceneCommandHandler.cs"],"tags":["commands"],"subsystem":"tooling","layer":"tooling","degree":1,"tier":3},{"id":"tl-cmd-place-track","label":"place-track","type":"command","summary":"Mutates: places a track segment between two endpoints (with optional directions) via TrackPlacingService; logs and returns trackIds JSON.","keyFiles":["src/Olve.Trains/Commands/GameLogic/PlaceTrackHandlerService.cs"],"tags":["commands"],"subsystem":"tooling","layer":"tooling","degree":2,"tier":3},{"id":"tl-cmd-place-building","label":"place-building","type":"command","summary":"Mutates: places a building/station at a position.","keyFiles":["src/Olve.Trains/Commands/GameLogic/PlaceBuildingHandlerService.cs"],"tags":["commands"],"subsystem":"tooling","layer":"tooling","degree":2,"tier":3},{"id":"tl-cmd-place-train","label":"place-train","type":"command","summary":"Mutates: spawns a train on a track.","keyFiles":["src/Olve.Trains/Commands/GameLogic/PlaceTrainHandlerService.cs"],"tags":["commands"],"subsystem":"tooling","layer":"tooling","degree":2,"tier":3},{"id":"tl-cmd-delete","label":"delete-track / delete-train / delete-object","type":"command","summary":"Mutates: removes tracks, trains, or environmental objects by id.","keyFiles":["src/Olve.Trains/Commands/GameLogic/DeleteTrackHandlerService.cs","src/Olve.Trains/Commands/GameLogic/DeleteTrainHandlerService.cs","src/Olve.Trains/Commands/GameLogic/DeleteEnvironmentalObjectHandlerService.cs"],"tags":["commands"],"subsystem":"tooling","layer":"tooling","degree":1,"tier":3},{"id":"tl-cmd-wagons","label":"add-wagon / remove-wagon / set-wagon-filter","type":"command","summary":"Mutates: manages a train's wagon consist and per-wagon cargo filters.","keyFiles":["src/Olve.Trains/Commands/GameLogic/AddWagonHandlerService.cs","src/Olve.Trains/Commands/GameLogic/RemoveWagonHandlerService.cs","src/Olve.Trains/Commands/GameLogic/SetWagonFilterHandlerService.cs"],"tags":["commands"],"subsystem":"tooling","layer":"tooling","degree":1,"tier":3},{"id":"tl-cmd-signals","label":"add-signal-rule / clear-signal-rules","type":"command","summary":"Mutates: configures junction signal routing rules.","keyFiles":[" "],"subsystem":"tooling","layer":"tooling","degree":3,"tier":3},{"id":"tl-stage-process-textures","label":"ProcessTextureAssets","type":"pipeline-stage","summary":"Converts image files into binary .texture assets + generated C# (assets/Textures).","keyFiles":["src/Olve.Trains.AssetPipeline/Assets/ProcessTextureAssets.cs"],"tags":["assetpipeline"],"subsystem":"tooling","layer":"tooling","degree":3,"tier":3},{"id":"tl-stage-process-terrains","label":"ProcessTerrainAssets","type":"pipeline-stage","summary":"Parses OpenRaster heightmap layers into binary .terrain assets + generated C# (assets/Terrains).","keyFiles":["src/Olve.Trains.AssetPipeline/Assets/ProcessTerrainAssets.cs","src/Olve.Trains.AssetPipeline/Assets/HeightmapLayerParser.cs"],"tags":["assetpipeline"],"subsystem":"tooling","layer":"tooling","degree":2,"tier":3},{"id":"tl-stage-process-atlases","label":"ProcessTextureAtlasAssets","type":"pipeline-stage","summary":"Packs textures into atlases and generates C# atlas-region accessor classes.","keyFiles":["src/Olve.Trains.AssetPipeline/Assets/ProcessTextureAtlasAssets.cs"],"tags":["assetpipeline"],"subsystem":"tooling","layer":"tooling","degree":2,"tier":3},{"id":"tl-stage-process-fonts","label":"ProcessFonts","type":"pipeline-stage","summary":"Generates MSDF font atlases (written as RGB .texture) + binary font assets + generated C#.","keyFiles":["src/Olve.Trains.AssetPipeline/Fonts/ProcessFonts.cs"],"tags":["assetpipeline"],"subsystem":"tooling","layer":"tooling","degree":2,"tier":3},{"id":"tl-asset-writer","label":"AssetWriter / TemplateWriter","type":"service","summary":"Writes binary assets and renders Scriban templates into generated C# source files.","keyFiles":["src/Olve.Trains.AssetPipeline/Assets/AssetWriter.cs","src/Olve.Trains.AssetPipeline/Assets/TemplateWriter.cs"],"tags":["assetpipeline"],"subsystem":"tooling","layer":"tooling","degree":3,"tier":3},{"id":"tl-tpl-shader","label":"ShaderClass.scriban","type":"template","summary":"Scriban template em ervice","label":"EventSceneService<T>","type":"service","summary":"Scene service bridging deferred events to lifecycle: Init/subscribe the EventQueue on Load, drain it on Update, Cleanup/unsubscribe on Unload.","keyFiles":["src/Olve.Engine3D/Systems/EventSceneService.cs"],"tags":["events","scene","deferred"],"subsystem":"engine-core","layer":"engine","degree":3,"tier":3},{"id":"core-immediate-event-scene-service","label":"ImmediateEventSceneService<T>","type":"service","summary":"Scene service that subscribes a handler directly to an Event<T> on Load (synchronous, no queue), runs prefill, and unsubscribes on Unload.","keyFiles":["src/Olve.Engine3D/Systems/ImmediateEventSceneService.cs"],"tags":["events","scene","immediate"],"subsystem":"engine-core","layer":"engine","degree":3,"tier":3},{"id":"core-icommand-handler","label":"ICommandHandler","type":"interface","summary":"Command contract: Verb, HelpString, Arguments, and Handle(CommandContext) returning Result<CommandOutput>. Implementations include echo/exit/help/log/screenshot/step.","keyFiles":["src/Olve.Engine3D/Commands/ICommandHandler.cs","src/Olve.Engine3D/Commands/CommandContext.cs"],"tags":["commands","olve-results"],"subsystem":"engine-core","layer":"engine","degree":2,"tier":4},{"id":"core-command-runner","label":"CommandRunner","type":"service","summary":"Parses a command line, finds the handler by Verb in CommandHandlerServiceCollection, validates arguments, and invokes Handle (supporting repeat count).","keyFiles":["src/Olve.Engine3D/Commands/CommandRunner.cs","src/Olve.Engine3D/Commands/CommandLineParser.cs"],"tags":["commands","dispatch"],"subsystem":"engine-core","layer":"engine","degree":5,"tier":4},{"id":"core-command-handler-collection","label":"CommandHandlerServiceCollection","type":"service","summary":"Mutable registry (HashSet) of ICommandHandler instances that scene services add/remove; the runner enumerates it to resolve verbs.","keyFiles":["src/Olve.Engine3D/Logging/CommandHandlerServiceCollection.cs"],"tags":["commands","registry"],"subsystem":"engine-core","layer":"engine","degree":1,"tier":4},{"id":"core-command-pipe-server","label":"CommandPipeServer","type":"service","summary":"Background named-pipe server (olve-trains-{instance}) on its own task; reads length-prefixed MemoryPack CommandRequests, enqueues them with a TaskCompletionSource, and writes back the CommandResponse.","keyFiles":["src/Olve.Engine3D/Commands/CommandPipeServer.cs","src/Olve.Engine3D/Commands/CommandPipeClient.cs","src/Olve.Engine3D/Commands/PipeMessages.cs"],"tags":["commands","ipc","named-pipe","memorypack"],"subsystem":"engine-core","layer":"engine","degree":3,"tier":4},{"id":"core-command-queue","label":"CommandQueue","type":"service","summary":"Thread-safe ConcurrentQueue of PendingCommand (command + TaskCompletionSource): pipe thread enqueues, main thread dequeues to keep command execution on the game loop.","keyFiles":["src/Olve.Engine3D/Commands/CommandQueue.cs"],"tags":["commands","concurrent","thread-bridge"],"subsystem":"engine-core","layer":"engine","degree":3,"tier":4},{"id":"core-command-processing-service","label":"CommandProcessingService","type":"service","summary":"Scene service (priority -1000) that drains the CommandQueue each Update tick, runs each via CommandRunner, and completes the TaskCompletionSource with a CommandResponse.","keyFiles":["src/Olve.Engine3D/Commands/CommandProcessingService.cs"],"tags":["commands","scene"],"subsystem":"engine-core","layer":"engine","degree":3,"tier":4},{"id":"core-game-instance-id","label":"GameInstanceId","type":"datatype","summary":"Identifies the instance and derives the pipe name (olve-trains-{id}) used by the pipe server/client.","keyFiles":["src/Olve.Engine3D/Commands/GameInstanceId.cs"],"tags":["commands","ipc"],"subsystem":"engine-core","layer":"engine","degree":1,"tier":1},{"id":"core-time-stepper","label":"ITimeStepper","type":"abstraction","summary":"Drives the loop, exposing Load/Update/Render/Closing eve const MF = MET.files || {};
let overlay = 'off';
const mMax = {loc:1, hotspot:1, coupling:1};
function aggMetrics(n){
  const kf=(n.keyFiles||[]).filter(f=>MF[f]); if(!kf.length) return null;
  let loc=0,cc=0,churn=0,commits=0,hot=0,cpl=0,dit=0,mis=[];
  for(const f of kf){const m=MF[f];loc+=m.source;cc+=m.cc;churn+=m.churn;commits+=m.commits;hot+=m.hotspot;cpl=Math.max(cpl,m.coupling);dit=Math.max(dit,m.dit);mis.push(m.mi);}
  return {loc,cc,churn,commits,hotspot:hot,coupling:cpl,dit,miMin:Math.min.apply(0,mis),miAvg:Math.round(mis.reduce((a,b)=>a+b,0)/mis.length),files:kf.length};
}
function _hx(c){return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';}
function _ramp(st,t){t=Math.max(0,Math.min(1,t));const s=t*(st.length-1),i=Math.floor(s),f=s-i;if(i>=st.length-1)return _hx(st[st.length-1]);const a=st[i],b=st[i+1];return _hx([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f]);}
const HEAT=[[60,95,150],[70,160,120],[225,190,80],[220,120,55],[210,55,50]];
const MIRAMP=[[205,60,55],[225,150,60],[228,212,95],[150,200,110],[90,190,120]];
const SEQ=[[70,110,175],[150,105,200],[205,80,155]];

function nodeRadius(n){ if(overlay==='off'||!n.m) return n.r; return 4.5+Math.min(20,Math.sqrt(n.m.loc)*0.95); }
function nodeFill(n){
  if(overlay==='off') return subColor(n.subsystem);
  if(!n.m) return '#39404e';
  if(overlay==='hotspot') return _ramp(HEAT,n.m.hotspot/mMax.hotspot);
  if(overlay==='maint') return miColor(n.m.miMin);
  if(overlay==='coupling') return _ramp(SEQ,n.m.coupling/mMax.coupling);

/* ---------- index ---------- */
const nodes = DATA.nodes, edges = DATA.edges;
const subs = DATA.subsystems, layers = DATA.layers;
const byId = new Map(nodes.map(n=>[n.id,n]));
const adj = new Map(nodes.map(n=>[n.id,[]]));
for(const e of edges){
  if(!byId.has(e.from)||!byId.has(e.to)) continue;
  adj.get(e.from).push({other:e.to,dir:'out',e});
  adj.get(e.to).push({other:e.from,dir:'in',e});
}
const subColor = id => (subs[id]&&subs[id].color)||'#9aa7b4';

/* ---------- layered layout: X = subsystem column · Y = abstraction tier (higher = up) ---------- */
const subOrder = Object.keys(subs);
const layerBands = {};
subOrder.forEach(id=>{ const L=subs[id].layer; (layerBands[L]=layerBands[L]||[]).push(id); });
const bandOrder = Object.keys(layers).sort((a,b)=>layers[a].order-layers[b].order);
// subsystem columns, ordered left→right and grouped by architectural layer
const orderedSubs = bandOrder.flatMap(L=>layerBands[L]||[]);
const W0=3000, H0=1900;
const subColX = {};
orderedSubs.forEach((id,i)=>{ subColX[id] = 280 + (orderedSubs.length<2?0:i*(W0-560)/(orderedSubs.length-1)); });
// tier rows: band height ∝ node count so the dense service tier gets room (T5 top … T0 bottom)
const TIERS=[5,4,3,2,1,0];
const tierMeta=DATA.tiers||{};
const tierCount={}; for(const t of TIERS) tierCount[t]=0;
for(const n of nodes) tierCount[n.tier]=(tierCount[n.tier]||0)+1;
const tierW=t=>Math.max(16, tierCount[t]||0);
const totalW=TIERS.reduce((s,t)=>s+tierW(t),0);
const padTopY=120, usableH=H0-padTopY*2;
const tierTop={}, tierH={}, tierMidY={};
{ let acc=padTopY; for(const t of TIERS){ const h=usableH*tierW(t)/totalW; tierTop[t]=acc; tierH[t]=h; tierMidY[t]=acc+h/2; acc+=h; } }
const colW=(W0-560)/Math.max(1,orderedSubs.length-1);
const anchorX=n=>subColX[n.subsystem]!==undefined?subColX[n.subsystem]:W0/2;
const anchorY=n=>tierMidY[n.tier]!==undefined?tierMidY[n.tier]:H0/2;

/* ---------- initial positions ---------- */
let seed=20260621;
const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
for(const n of nodes){
  n.x=anchorX(n)+(rnd()-.5)*Math.min(300,colW*0.8);
  n.y=anchorY(n)+(rnd()-.5)*Math.min(180,(tierH[n.tier]||200)*0.7);
  n.vx=0; n.vy=0;
  n.r = 5.5 + Math.min(10, Math.sqrt(n.degree||1)*2.1);
  n.hidden=false; n.pinned=false;
}

/* ---------- force simulation ---------- */
let alpha=1;
function tick(){
  if(alpha<0.004) return;
  const REP=210, LINK=0.005, COLX=0.020, TIERY=0.050;  // weak links so tier rows stay crisp
  // repulsion (brute force, full long-range — fine at this scale) — only among visible
  const V=nodes.filter(n=>!n.hidden);
  for(let i=0;i<V.length;i++){
    const a=V[i];
    for(let j=i+1;j<V.length;j++){
      const b=V[j];
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy;
      if(d2<0.01){dx=(rnd()-.5);dy=(rnd()-.5);d2=dx*dx+dy*dy+0.01;}
      const minD=(a.r+b.r+20);
      const d=Math.sqrt(d2);
      let f=REP*REP/d2;
      if(d<minD) f+= (minD-d)*1.1; // hard collision
      const fx=dx/d*f, fy=dy/d*f;
      a.vx+=fx*alpha; a.vy+=fy*alpha; b.vx-=fx*alpha; b.vy-=fy*alpha;
    }
  }
  // link springs
  for(const e of edges){
    const a=byId.get(e.from), b=byId.get(e.to);
    if(!a||!b||a.hidden||b.hidden) continue;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    const rest = e.scope==='cross'?280:110;
    const f=(d-rest)*LINK;
    const fx=dx/d*f, fy=dy/d*f;
    a.vx+=fx*alpha; a.vy+=fy*alpha; b.vx-=fx*alpha; b.vy-=fy*alpha;
  }
  // anchor to subsystem column (X) and abstraction tier (Y); tier pull is stronger
  for(const n of V){
    if(n.pinned) continue;
    n.vx+=(anchorX(n)-n.x)*COLX*alpha;
    n.vy+=(anchorY(n)-n.y)*TIERY*alpha;
  }
  // integrate (clamp velocity to avoid blow-ups)
  for(const n of V){
    if(n.pinned){n.vx=0;n.vy=0;continue;}
    const sp=Math.hypot(n.vx,n.vy), MAX=40;
    if(sp>MAX){n.vx*=MAX/sp;n.vy*=MAX/sp;}
    n.x+=n.vx; n.y+=n.vy; n.vx*=0.86; n.vy*=0.86;
  }
  alpha*=0.992;
}
function reheat(a=0.6){ alpha=Math.max(alpha,a); }

/* ---------- view transform ---------- */
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let view={x:0,y:0,k:1}, dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){
  const r=canvas.getBoundingClientRect();
  canvas.width=r.width*dpr; canvas.height=r.height*dpr;
}
window.addEventListener('resize',()=>{resize();});
function fit(animate){
  const V=nodes.filter(n=>!n.hidden); if(!V.length)return;
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const n of V){minx=Math.min(minx,n.x);miny=Math.min(miny,n.y);maxx=Math.max(maxx,n.x);maxy=Math.max(maxy,n.y);}
  const pad=80, r=canvas.getBoundingClientRect();
  const k=Math.min((r.width-pad*2)/(maxx-minx||1),(r.height-pad*2)/(maxy-miny||1),1.6);
  const tx=r.width/2-(minx+maxx)/2*k, ty=r.height/2-(miny+maxy)/2*k;
  if(animate){animateView(tx,ty,k);} else {view.x=tx;view.y=ty;view.k=k;}
}
let va=null;
function animateView(x,y,k){ va={x0:view.x,y0:view.y,k0:view.k,x1:x,y1:y,k1:k,t:0}; }
function stepView(){
  if(!va)return;
  va.t+=0.08; const t=va.t>=1?1:(1-Math.pow(1-va.t,3));
  view.x=va.x0+(va.x1-va.x0)*t; view.y=va.y0+(va.y1-va.y0)*t; view.k=va.k0+(va.k1-va.k0)*t;
  if(va.t>=1)va=null;
}
const toWorld=(sx,sy)=>({x:(sx-view.x)/view.k,y:(sy-view.y)/view.k});

/* ---------- interaction state ---------- */
let hover=null, selected=null, query='', drag=null, panning=null, moved=false;
const hl = {nodes:new Set(), edges:new Set()};   // highlighted (neighbors of hover/selected)
function computeHighlight(){
  hl.nodes.clear(); hl.edges.clear();
  const focus = hover||selected;
  if(!focus) return;
  hl.nodes.add(focus.id);
  for(const a of adj.get(focus.id)){ hl.nodes.add(a.other); hl.edges.add(a.e); }
}
function matchQuery(n){
  if(!query) return false;
  const q=query.toLowerCase();
  return n.label.toLowerCase().includes(q) || (n.summary||'').toLowerCase().includes(q)
    || (n.tags||[]).some(t=>t.toLowerCase().includes(q))
    || (n.keyFiles||[]).some(f=>f.toLowerCase().includes(q)) || n.id.includes(q);
}

/* ---------- draw ---------- */
function draw(){
  stepView();
  ctx.save();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const r=canvas.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);
  ctx.translate(view.x,view.y); ctx.scale(view.k,view.k);

  const focus=hover||selected;
  const hasQuery=!!query;
  const anyFocus=!!focus;

  // abstraction-tier swimlanes (Y axis) — drawn behind everything
  drawTiers();
  // subsystem cluster halos
  drawHalos();

  // edges
  ctx.lineWidth=1/view.k;
  for(const e of edges){
    const a=byId.get(e.from), b=byId.get(e.to);
    if(!a||!b||a.hidden||b.hidden) continue;
    const isHL=hl.edges.has(e);
    let alphaE;
    if(anyFocus) alphaE = isHL?0.9:0.04;
    else alphaE = e.scope==='cross'?0.22:0.10;
    if(alphaE<=0.01) continue;
    ctx.globalAlpha=alphaE;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    if(e.scope==='cross'){
      ctx.strokeStyle=isHL?'#eef3f8':'#aeb9c8';
      ctx.lineWidth=(isHL?2.0:1.1)/view.k; ctx.setLineDash([5/view.k,3/view.k]);
    } else {
      ctx.strokeStyle=isHL?subColor(a.subsystem):'#5a6678';
      ctx.lineWidth=(isHL?1.8:0.9)/view.k; ctx.setLineDash([]);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]); ctx.globalAlpha=1;

  // arrowheads only for highlighted edges
  if(anyFocus){
    for(const e of hl.edges){
      const a=byId.get(e.from), b=byId.get(e.to);
      if(!a||!b)continue;
      const ang=Math.atan2(b.y-a.y,b.x-a.x);
      const tx=b.x-Math.cos(ang)*(b.r+3), ty=b.y-Math.sin(ang)*(b.r+3);
      const s=7/view.k;
      ctx.fillStyle=e.scope==='cross'?'#eef3f8':subColor(a.subsystem);
      ctx.beginPath();
      ctx.moveTo(tx,ty);
      ctx.lineTo(tx-Math.cos(ang-0.4)*s,ty-Math.sin(ang-0.4)*s);
      ctx.lineTo(tx-Math.cos(ang+0.4)*s,ty-Math.sin(ang+0.4)*s);
      ctx.closePath(); ctx.fill();
    }
  }

  // nodes
  for(const n of nodes){
    if(n.hidden) continue;
    const isFocus = focus&&focus.id===n.id;
    const isNb = hl.nodes.has(n.id);
    const isMatch = hasQuery&&matchQuery(n);
    let dim = (anyFocus&&!isNb) || (hasQuery&&!isMatch);
    ctx.globalAlpha = dim?0.18:1;
    const col=nodeFill(n);
    const rv=nodeRadius(n); n._rv=rv;
    // glow for focus / match

      ctx.beginPath(); ctx.arc(n.x,n.y,rv+6/view.k,0,7);
      ctx.fillStyle=isMatch&&!isFocus?'rgba(88,166,255,.22)':hexA(typeof col==='string'&&col[0]==='#'?col:'#9aa7b4',.28); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(n.x,n.y,rv,0,7);
    ctx.fillStyle=col; ctx.fill();
    ctx.lineWidth=(isFocus?2.4:1.2)/view.k;
    ctx.strokeStyle=isFocus?'#fff':hexA('#000',.35); ctx.stroke();
    ctx.globalAlpha=1;
  }

  // labels
  const showAllLabels = view.k>1.05;
  ctx.textBaseline='middle';
  for(const n of nodes){
    if(n.hidden) continue;
    const isFocus=focus&&focus.id===n.id, isNb=hl.nodes.has(n.id);
    const isMatch=hasQuery&&matchQuery(n);
    const important = n.degree>=10 || n.type==='project'||n.type==='product'||n.type==='scene';
    let show = isFocus||isMatch||(anyFocus&&isNb)|| (!anyFocus&&!hasQuery&&(showAllLabels||important));
    if(!show) continue;
    if(anyFocus&&!isNb&&!isFocus) continue;
    const fs=Math.max(10, (isFocus?13:11))/view.k;
    ctx.font=`${isFocus?600:500} ${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif`;
    const tx=n.x+(n._rv||n.r)+4/view.k, ty=n.y;
    const w=ctx.measureText(n.label).width;
    ctx.globalAlpha=isFocus?1:0.92;
    ctx.fillStyle='rgba(13,17,23,.72)';
    ctx.fillRect(tx-2/view.k,ty-fs*0.65,w+4/view.k,fs*1.3);
    ctx.fillStyle=isFocus?'#fff':'#cdd6e0';
    ctx.fillText(n.label,tx,ty);
    ctx.globalAlpha=1;
  }

}
function drawHalos(){
  // soft cluster background per subsystem
  const groups={};
  for(const n of nodes){ if(n.hidden)continue; (groups[n.subsystem]=groups[n.subsystem]||[]).push(n); }
  for(const sid in groups){
    const g=groups[sid]; if(g.length<2)continue;
    let cx=0,cy=0; for(const n of g){cx+=n.x;cy+=n.y;} cx/=g.length;cy/=g.length;
    let rad=0; for(const n of g){rad=Math.max(rad,Math.hypot(n.x-cx,n.y-cy)+n.r);}
    rad+=26;
    const grd=ctx.createRadialGradient(cx,cy,rad*0.2,cx,cy,rad);
    grd.addColorStop(0,hexA(subColor(sid),.10));
    grd.addColorStop(1,hexA(subColor(sid),0));
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(cx,cy,rad,0,7); ctx.fill();
  }
}
function drawTiers(){
  const xL=-40, xR=W0+40;
  for(const t of TIERS){
    const y0=tierTop[t], h=tierH[t], yC=tierMidY[t];
    // alternating faint band fill
    ctx.fillStyle = (t%2===0)?'rgba(255,255,255,0.014)':'rgba(255,255,255,0.030)';
    ctx.fillRect(xL,y0,xR-xL,h);
    // separator line at top of band
    ctx.strokeStyle='rgba(120,140,170,0.16)'; ctx.lineWidth=1/view.k;
    ctx.beginPath(); ctx.moveTo(xL,y0); ctx.lineTo(xR,y0); ctx.stroke();
    // tier label at the left, in world space
    const m=tierMeta[t]||{}; const fs=Math.max(13,15/view.k);
    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.font=`700 ${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif`;
    ctx.fillStyle='rgba(210,222,236,0.5)';
    ctx.fillText(`T${t} · ${m.label||''}`, xL+24/view.k, yC-9/view.k);
    ctx.font=`500 ${Math.max(10,11.5/view.k)}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif`;
    ctx.fillStyle='rgba(150,167,184,0.45)';
    ctx.fillText(m.hint||'', xL+24/view.k, yC+10/view.k);
  }
  // bottom separator
  ctx.strokeStyle='rgba(120,140,170,0.16)'; ctx.lineWidth=1/view.k;
  ctx.beginPath(); ctx.moveTo(xL,tierTop[0]+tierH[0]); ctx.lineTo(xR,tierTop[0]+tierH[0]); ctx.stroke();
  // up arrow + axis caption on far left
  const fs2=Math.max(11,12/view.k);
  ctx.save(); ctx.translate(xL-10/view.k, (tierTop[5]+tierTop[0]+tierH[0])/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign='center'; ctx.font=`600 ${fs2}px -apple-system,sans-serif`;
  ctx.fillStyle='rgba(150,167,184,0.5)';
  ctx.fillText('↑ higher level of abstraction / control', 0, 0);
  ctx.restore();
  // subsystem column headers across the top (X axis)
  const hy=tierTop[5]-34/view.k, fsc=Math.max(11,13/view.k);
  ctx.textAlign='center'; ctx.font=`700 ${fsc}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
  for(const sid of orderedSubs){
    const anyVis=nodes.some(n=>n.subsystem===sid&&!n.hidden); if(!anyVis)continue;
    ctx.fillStyle=hexA(subColor(sid),.85);
    ctx.fillText((subs[sid].label||sid), subColX[sid], hy);
  }
  ctx.textAlign='left';
}
function drawHalos(){
  // soft cluster background per subsystem
  const groups={};
  for(const n of nodes){ if(n.hidden)continue; (groups[n.subsystem]=groups[n.subsystem]||[]).push(n); }
  for(const sid in groups){
    const g=groups[sid]; if(g.length<2)continue;
    let cx=0,cy=0; for(const n of g){cx+=n.x;cy+=n.y;} cx/=g.length;cy/=g.length;
    // subsystems are vertical columns now — use an elongated vertical halo
    let rx=0,ry=0; for(const n of g){rx=Math.max(rx,Math.abs(n.x-cx)+n.r);ry=Math.max(ry,Math.abs(n.y-cy)+n.r);}
    rx+=30; ry+=30;
    ctx.save(); ctx.translate(cx,cy); ctx.scale(rx,ry);
    const grd=ctx.createRadialGradient(0,0,0.15,0,0,1);
    grd.addColorStop(0,hexA(subColor(sid),.085)); grd.addColorStop(1,hexA(subColor(sid),0));
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(0,0,1,0,7); ctx.fill(); ctx.restore();
  }
}
function hexA(hex,a){
  if(hex[0]!=='#')return hex;
  const h=hex.slice(1); const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

/* ---------- main loop ---------- */
function loop(){ tick(); draw(); requestAnimationFrame(loop); }

/* ---------- hit testing ---------- */
function nodeAt(sx,sy,pad){
  pad=pad||6;
  const w=toWorld(sx,sy); let best=null,bd=1e9;
  for(const n of nodes){
    if(n.hidden)continue;
    const d=Math.hypot(n.x-w.x,n.y-w.y);
    if(d<(n._rv||n.r)+pad/view.k && d<bd){bd=d;best=n;}
  }
  return best;
}

/* ---------- pointer events ---------- */
const tooltip=document.getElementById('tooltip');
canvas.addEventListener('mousemove',ev=>{
  const r=canvas.getBoundingClientRect(), sx=ev.clientX-r.left, sy=ev.clientY-r.top;
  if(drag){
    const w=toWorld(sx,sy); drag.x=w.x; drag.y=w.y; drag.pinned=true; drag.vx=0;drag.vy=0;
    moved=true; reheat(0.3); return;
  }
  if(panning){ view.x=panning.vx+(ev.clientX-panning.sx); view.y=panning.vy+(ev.clientY-panning.sy); moved=true; return; }
  const n=nodeAt(sx,sy);
  if(n!==hover){ hover=n; computeHighlight(); canvas.className=n?'pointing':''; }
  if(n){
    tooltip.style.opacity=1;
    tooltip.style.left=Math.min(sx+14,r.width-290)+'px';
    tooltip.style.top=(sy+14)+'px';
    tooltip.innerHTML=`<div class="tt-t">${esc(n.label)}</div><div class="tt-s">${esc(n.summary||'')}</div>`+
      `<div class="tt-m">${esc((subs[n.subsystem]||{}).label||n.subsystem)} · ${esc(n.type)} · ${n.degree} links</div>`;
  } else tooltip.style.opacity=0;
});
canvas.addEventListener('mousedown',ev=>{
  const r=canvas.getBoundingClientRect(), sx=ev.clientX-r.left, sy=ev.clientY-r.top;
  const n=nodeAt(sx,sy); moved=false;
  if(n){ drag=n; canvas.classList.add('grabbing'); }
  else { panning={sx:ev.clientX,sy:ev.clientY,vx:view.x,vy:view.y}; canvas.classList.add('grabbing'); }
});
window.addEventListener('mouseup',ev=>{
  if(drag && !moved){ select(drag); }
  else if(panning && !moved){ if(selected){select(null);} }
  drag=null; panning=null; canvas.classList.remove('grabbing');
});
canvas.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const r=canvas.getBoundingClientRect(), sx=ev.clientX-r.left, sy=ev.clientY-r.top;
  const f=Math.exp(-ev.deltaY*0.0014), nk=Math.max(0.18,Math.min(4,view.k*f));
  view.x=sx-(sx-view.x)*(nk/view.k); view.y=sy-(sy-view.y)*(nk/view.k); view.k=nk;
},{passive:false});
canvas.addEventListener('dblclick',ev=>{
  const r=canvas.getBoundingClientRect();
  const n=nodeAt(ev.clientX-r.left,ev.clientY-r.top);
  if(n){ n.pinned=false; reheat(0.5); }
});

/* ---------- touch: one-finger pan/drag · pinch zoom · tap select ---------- */
const touch={mode:null,node:null,dist:0,mx:0,my:0,sx:0,sy:0,vx:0,vy:0,startX:0,startY:0,moved:false};
const tpos=t=>{const r=canvas.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top};};
canvas.addEventListener('touchstart',ev=>{
  ev.preventDefault(); tooltip.style.opacity=0; hover=null; computeHighlight();
  if(ev.touches.length===1){
    const p=tpos(ev.touches[0]);
    touch.mode='one'; touch.startX=p.x; touch.startY=p.y; touch.moved=false;
    touch.node=nodeAt(p.x,p.y,18);
    touch.sx=p.x; touch.sy=p.y; touch.vx=view.x; touch.vy=view.y;
  } else if(ev.touches.length>=2){
    const a=tpos(ev.touches[0]), b=tpos(ev.touches[1]);
    touch.mode='pinch'; touch.node=null; touch.moved=true;
    touch.dist=Math.hypot(a.x-b.x,a.y-b.y); touch.mx=(a.x+b.x)/2; touch.my=(a.y+b.y)/2;
  }
},{passive:false});
canvas.addEventListener('touchmove',ev=>{
  ev.preventDefault();
  if(touch.mode==='one' && ev.touches.length===1){
    const p=tpos(ev.touches[0]);
    if(Math.hypot(p.x-touch.startX,p.y-touch.startY)>6) touch.moved=true;
    if(touch.node){ const w=toWorld(p.x,p.y); touch.node.x=w.x; touch.node.y=w.y;
      touch.node.pinned=true; touch.node.vx=0; touch.node.vy=0; reheat(0.3); }
    else { view.x=touch.vx+(p.x-touch.sx); view.y=touch.vy+(p.y-touch.sy); }
  } else if(touch.mode==='pinch' && ev.touches.length>=2){
    const a=tpos(ev.touches[0]), b=tpos(ev.touches[1]);
    const d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const f=touch.dist>0?d/touch.dist:1, nk=Math.max(0.12,Math.min(5,view.k*f));
    view.x=mx-(mx-view.x)*(nk/view.k); view.y=my-(my-view.y)*(nk/view.k); view.k=nk; // zoom about midpoint
    view.x+=mx-touch.mx; view.y+=my-touch.my;                                          // + two-finger pan
    touch.dist=d; touch.mx=mx; touch.my=my;
  }
},{passive:false});
function endTouch(ev){
  ev.preventDefault();
  if(touch.mode==='one' && !touch.moved){
    const n=touch.node||nodeAt(touch.startX,touch.startY,18);
    if(n){ select(n); } else if(selected||D('detail').classList.contains('open')){ select(null); }
  }
  if(ev.touches.length===0){ touch.mode=null; touch.node=null; }
  else if(ev.touches.length===1){ // pinch → single finger: re-baseline pan, no accidental tap
    const p=tpos(ev.touches[0]);
    touch.mode='one'; touch.node=null; touch.moved=true;
    touch.sx=p.x; touch.sy=p.y; touch.vx=view.x; touch.vy=view.y;
  }
}
canvas.addEventListener('touchend',endTouch,{passive:false});
canvas.addEventListener('touchcancel',ev=>{ev.preventDefault();touch.mode=null;touch.node=null;},{passive:false});

/* ---------- selection + detail panel ---------- */
const D=id=>document.getElementById(id);
function select(n){
  selected=n; computeHighlight();
  const panel=D('detail');
  if(!n){ panel.classList.remove('open'); return; }
  panel.classList.add('open');
  const s=subs[n.subsystem]||{};
  D('d-sw').style.background=subColor(n.subsystem);
  D('d-sub').textContent=(s.label||n.subsystem)+'  ·  T'+n.tier+' '+((tierMeta[n.tier]||{}).label||'');
  D('d-title').textContent=n.label;
  const fout=adj.get(n.id).filter(a=>a.dir==='out').length, fin=adj.get(n.id).filter(a=>a.dir==='in').length;
  const inst=(fout+fin)?(fout/(fout+fin)):0;
  D('d-type').innerHTML=esc(n.type)
    +'  ·  <span title="incoming dependencies — how depended-upon this is">fan-in '+fin+'</span>'
    +' / <span title="outgoing dependencies — how much this depends on">fan-out '+fout+'</span>'
    +'  ·  <span title="instability I = fan-out / (fan-in+fan-out). High = application/control level (depends on many); low = foundational (depended upon).">I='+inst.toFixed(2)+'</span>'
    +'<br><span style="opacity:.55">'+esc(n.id)+'</span>';
  D('d-summary').textContent=n.summary||'';
  // code metrics section
  const mc=D('d-metrics'); const m=n.m;
  if(m){ D('d-metrics-sec').style.display='';
    const miCol=miColor(m.miMin); const miLab=m.miMin>=20?'good':(m.miMin>=10?'moderate':'low');
    const rows=[
      [`Maintainability`, `<span class="mi-badge" style="background:${miCol};color:#0c1118">${m.miMin}</span> <span style="color:var(--ink-faint);font-size:10px">${miLab}${m.files>1?` · ${m.miAvg} avg`:''}</span>`],
      [`Cyclomatic`, m.cc],
      [`Class coupling`, m.coupling],
      [`Inheritance depth`, m.dit],
      [`Code lines`, m.loc],
      [`Git commits`, m.commits],
      [`Churn (lines)`, m.churn],
      [`Hotspot`, m.hotspot.toFixed(0)],
    ];
    mc.innerHTML=rows.map(([k,v])=>`<div class="mrow"><span class="mk">${k}</span><span class="mv">${v}</span></div>`).join('');
  } else { D('d-metrics-sec').style.display='none'; }
  // files
  const fc=D('d-files'); fc.innerHTML='';
  if(n.keyFiles&&n.keyFiles.length){ D('d-files-sec').style.display='';
    n.keyFiles.forEach(f=>{const d=document.createElement('div');d.className='file';d.textContent=f;fc.appendChild(d);});
  } else D('d-files-sec').style.display='none';
  // tags
  const tc=D('d-tags'); tc.innerHTML='';
  if(n.tags&&n.tags.length){ D('d-tags-sec').style.display='';
    n.tags.forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;tc.appendChild(s);});
  } else D('d-tags-sec').style.display='none';
  // relations
  const rc=D('d-rels'); rc.innerHTML='';
  const rels=adj.get(n.id).slice().sort((a,b)=> (a.dir===b.dir?0:a.dir==='out'?-1:1));
  D('d-rel-ct').textContent='('+rels.length+')';
  if(!rels.length){ rc.innerHTML='<div class="empty">No connections.</div>'; }
  rels.forEach(rel=>{
    const o=byId.get(rel.other); if(!o)return;
    const row=document.createElement('div'); row.className='rel';
    const verb=rel.e.type+(rel.e.label?' · '+rel.e.label:'');
    row.innerHTML=`<span class="dir ${rel.dir}">${rel.dir==='out'?'→':'←'}</span>`+
      `<span class="rsw" style="background:${subColor(o.subsystem)}"></span>`+
      `<span class="rl">${esc(o.label)}<div class="rtype">${esc(verb)}</div></span>`;
    row.onclick=()=>{ select(o); focusNode(o); };
    rc.appendChild(row);
  });
}
function focusNode(n){ animateView(canvas.getBoundingClientRect().width/2-n.x*view.k, canvas.getBoundingClientRect().height/2-n.y*view.k, Math.max(view.k,1.1)); }
D('d-close').onclick=()=>select(null);

/* ---------- search ---------- */
const searchEl=D('search'), searchMeta=D('search-meta');
searchEl.addEventListener('input',()=>{
  query=searchEl.value.trim();
  if(query){
    const m=nodes.filter(n=>!n.hidden&&matchQuery(n));
    searchMeta.textContent=m.length+' match'+(m.length===1?'':'es');
    if(m.length){ // frame matches
      let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
      for(const n of m){minx=Math.min(minx,n.x);miny=Math.min(miny,n.y);maxx=Math.max(maxx,n.x);maxy=Math.max(maxy,n.y);}
      const rr=canvas.getBoundingClientRect(),pad=120;
      const k=Math.min((rr.width-pad*2)/(maxx-minx||1),(rr.height-pad*2)/(maxy-miny||1),1.4);
      animateView(rr.width/2-(minx+maxx)/2*k, rr.height/2-(miny+maxy)/2*k, Math.max(0.3,k));
    }
  } else searchMeta.textContent='';
});

/* ---------- legend / subsystem filters ---------- */
function buildLegend(){
  const host=D('legend'); host.innerHTML='';
  for(const L of bandOrder){
    if(L==='overview'){ /* still show */ }
    const ids=(layerBands[L]||[]); if(!ids.length)continue;
    const lab=document.createElement('div'); lab.className='layer-label';
    lab.textContent=(layers[L]||{}).label||L; host.appendChild(lab);
    for(const sid of ids){
      const s=subs[sid], ct=nodes.filter(n=>n.subsystem===sid).length;
      const row=document.createElement('div'); row.className='leg-row'; row.dataset.sid=sid;
      row.innerHTML=`<span class="sw" style="background:${s.color}"></span>`+
        `<span class="nm">${esc(s.label)}</span><span class="ct">${ct}</span>`+
        `<span class="solo" title="solo">solo</span>`;
      row.querySelector('.nm').onclick=row.querySelector('.sw').onclick=()=>toggleSub(sid,row);
      row.querySelector('.ct').onclick=()=>toggleSub(sid,row);
      row.querySelector('.solo').onclick=(e)=>{e.stopPropagation();soloSub(sid);};
      host.appendChild(row);
    }
  }
}
// composable filters: a node is hidden if its subsystem OR its tier is filtered out
const hiddenSubs=new Set(), hiddenTiers=new Set();
function applyVis(){ for(const n of nodes) n.hidden = hiddenSubs.has(n.subsystem)||hiddenTiers.has(n.tier); }
function afterFilter(refit){ applyVis(); syncLegend(); reheat(0.4); refreshStats(); if(selected&&selected.hidden)select(null); if(refit)fit(true); }
function toggleSub(sid){ hiddenSubs.has(sid)?hiddenSubs.delete(sid):hiddenSubs.add(sid); afterFilter(); }
function soloSub(sid){ hiddenSubs.clear(); for(const s of orderedSubs) if(s!==sid)hiddenSubs.add(s); afterFilter(true); }
function toggleTier(t){ hiddenTiers.has(t)?hiddenTiers.delete(t):hiddenTiers.add(t); afterFilter(); }
function syncLegend(){
  document.querySelectorAll('.leg-row[data-sid]').forEach(r=>r.classList.toggle('off',hiddenSubs.has(r.dataset.sid)));
  document.querySelectorAll('.leg-row[data-tier]').forEach(r=>r.classList.toggle('off',hiddenTiers.has(+r.dataset.tier)));
}
function buildTierLegend(){
  const host=D('tier-legend'); if(!host)return; host.innerHTML='';
  for(const t of TIERS){
    const m=tierMeta[t]||{}, ct=tierCount[t]||0;
    const row=document.createElement('div'); row.className='leg-row'; row.dataset.tier=t;
    row.innerHTML=`<span class="sw" style="background:rgba(150,167,184,.45);border-radius:2px"></span>`+
      `<span class="nm" title="${esc(m.hint||'')}"><span style="font-family:var(--mono);font-size:9.5px;color:var(--ink-faint)">T${t}</span> ${esc(m.label||'')}</span>`+
      `<span class="ct">${ct}</span>`;
    row.onclick=()=>toggleTier(t);
    host.appendChild(row);
  }
}
D('show-all').onclick=()=>{ hiddenSubs.clear(); hiddenTiers.clear(); afterFilter(true); };

/* ---------- buttons / zoom ---------- */
D('btn-reset').onclick=()=>{ select(null); query='';searchEl.value='';searchMeta.textContent=''; fit(true); };
D('btn-relayout').onclick=()=>{
  for(const n of nodes){ n.x=anchorX(n)+(rnd()-.5)*Math.min(300,colW*0.8); n.y=anchorY(n)+(rnd()-.5)*Math.min(180,(tierH[n.tier]||200)*0.7); n.vx=0;n.vy=0;n.pinned=false; }
  alpha=1; for(let i=0;i<460;i++) tick(); fit(true);
};
D('zin').onclick=()=>zoomBtn(1.3); D('zout').onclick=()=>zoomBtn(1/1.3); D('zfit').onclick=()=>fit(true);
function zoomBtn(f){ const r=canvas.getBoundingClientRect(),sx=r.width/2,sy=r.height/2;
  const nk=Math.max(0.18,Math.min(4,view.k*f));
  view.x=sx-(sx-view.x)*(nk/view.k);view.y=sy-(sy-view.y)*(nk/view.k);view.k=nk; }

/* ---------- stats ---------- */
function refreshStats(){
  const vn=nodes.filter(n=>!n.hidden).length;
  const ve=edges.filter(e=>!byId.get(e.from).hidden&&!byId.get(e.to).hidden).length;
  D('stats').innerHTML=`${vn} / ${nodes.length} nodes · ${ve} / ${edges.length} edges visible`;
}

/* ---------- util ---------- */
function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- boot ---------- */
D('brand-sub').textContent=`${nodes.length} nodes · ${edges.length} edges · ${DATA.meta.generated}`;
D('brand-summary').textContent=DATA.meta.summary;
// map metrics onto nodes + compute overlay maxima
for(const n of nodes) n.m=aggMetrics(n);
for(const n of nodes){ if(n.m){ mMax.loc=Math.max(mMax.loc,n.m.loc); mMax.hotspot=Math.max(mMax.hotspot,n.m.hotspot); mMax.coupling=Math.max(mMax.coupling,n.m.coupling); } }
function setOverlay(ov){
  overlay=ov;
  document.querySelectorAll('.ov-btn').forEach(b=>b.classList.toggle('on',b.dataset.ov===ov));
  const L=D('overlay-legend');
  if(ov==='off'){ L.innerHTML=''; return; }
  const grad=(st)=>`linear-gradient(90deg,${st.map((c,i)=>`rgb(${c[0]},${c[1]},${c[2]}) ${i/(st.length-1)*100}%`).join(',')})`;
  let bar,lo,hi,note;
  if(ov==='hotspot'){ bar=grad(HEAT); lo='cool'; hi='hot'; note='Size = code lines · color = complexity × churn (refactor ROI).'; }
  else if(ov==='maint'){ bar=grad(MIRAMP); lo='15 (low)'; hi='95 (high)'; note='Size = code lines · color = Maintainability Index (worst file in node).'; }
  else { bar=grad(SEQ); lo='0'; hi=mMax.coupling+''; note='Size = code lines · color = class coupling (distinct types referenced).'; }
  L.innerHTML=`<div class="ov-bar" style="background:${bar}"></div><div class="ov-scale"><span>${lo}</span><span>${hi}</span></div><div class="ov-note">${note} <span style="opacity:.6">Grey = no code (templates, deps).</span></div>`;
}
D('overlay-ctl').addEventListener('click',e=>{ const b=e.target.closest('.ov-btn'); if(b) setOverlay(b.dataset.ov); });

buildTierLegend(); buildLegend(); refreshStats(); resize();

/* ---------- collapsible bars (mobile-friendly) ---------- */
const sideEl=D('side'), sideToggle=D('side-toggle');
const isNarrow=()=>window.matchMedia('(max-width:760px)').matches;
function setSide(collapsed){
  sideEl.classList.toggle('collapsed',collapsed);
  sideToggle.innerHTML=collapsed?'☰':'✕';
  // canvas width changes on desktop (sidebar in flow); recompute after transition
  resize(); setTimeout(resize,140); setTimeout(resize,300);
}
sideToggle.addEventListener('click',()=>setSide(!sideEl.classList.contains('collapsed')));
// start collapsed on phones so the graph gets the whole screen
setSide(isNarrow());
// on mobile, picking a search result or node should reveal the canvas
window.addEventListener('resize',()=>{ if(isNarrow()&&!sideEl.classList.contains('collapsed')){} resize(); });

// settle layout to a calm state off-screen, then frame it
alpha=1; for(let i=0;i<460;i++) tick();
fit(false);
loop();
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(D('detail').classList.contains('open'))select(null); else if(!sideEl.classList.contains('collapsed'))setSide(true);} if(e.key==='/'&&document.activeElement!==searchEl){e.preventDefault();searchEl.focus();} });
</script>
</body>
